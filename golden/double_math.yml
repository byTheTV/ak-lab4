name: double_math
source: |
  (progn
    (setq a_hi 1)
    (setq a_lo -1)
    (setq b_hi 2)
    (setq b_lo 1)
    (setq sum_lo (+ a_lo b_lo))
    (setq carry (if (eq sum_lo 0) 1 0))
    (setq sum_hi (+ (+ a_hi b_hi) carry))
    (out (+ sum_lo 48))
    (out 32)
    (out (+ sum_hi 48))
    (out 10))
